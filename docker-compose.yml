services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_NAME=inscripciones
      - DB_USER=root
      - DB_PASSWORD=passworddb
    volumes:
      - ./app:/var/www/html
  db:
    image: mariadb:11
    environment:
      - MARIADB_ROOT_PASSWORD=passworddb
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    ports:
      - 8081:8080
    environment:
      - ADMINER_DEFAULT_SERVER=db

volumes:
  db_data:
